<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vigilia settings — About</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0e12; font: 12px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
</style>
</head>
<body>
<!-- The settings surface with §7's About panel showing. Copy is the product's own
     (`ui-copy.ts`'s `settings`); the facts are `versionFacts()` — the schema
     version this build reads, and the open document's release version, which no
     document this editor can load carries (`vg-288`), so the absent case is the
     drawn one. The frame, the navigation and the Close are `settings.html`'s
     declarations, character for character, so the three files draw one modal. -->
<div style="--bg:#0b0e12;--hdr:#12161c;--panel:#12161c;--panel2:#171c23;--well:#171c23;--well-edge:#242b34;
            --edge:#242b34;--edge2:#1b212a;--text:#e8ecf3;--muted:#8a97ab;--faint:#5a6675;--accent:#72e0c0;
            min-height:100vh;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px">

  <div style="width:560px;display:flex;border:1px solid var(--edge);border-radius:8px;background:var(--panel);box-shadow:0 24px 60px #000000b3;overflow:hidden">

    <div style="width:150px;flex:0 0 auto;background:#0e1217;border-right:1px solid var(--edge);padding:11px 7px">
      <div style="font:600 10px/1 system-ui;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);padding:4px 8px 8px">Settings</div>

      <div style="display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:6px;color:var(--muted)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><circle cx="9" cy="10" r="1.3" fill="currentColor" stroke="none"/><circle cx="14" cy="14" r="1.3" fill="currentColor" stroke="none"/></svg>
        <span>Appearance</span>
      </div>

      <div style="display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:6px;color:var(--muted)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h1M10 10h1M14 10h1M18 10h1M7 14h10"/></svg>
        <span>Keyboard</span>
      </div>

      <div style="display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:6px;background:#1d2733;box-shadow:inset 2px 0 0 var(--accent)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M12 16v-5M12 8h.01"/></svg>
        <span>About</span>
      </div>
    </div>

    <div style="flex:1;min-width:0;padding:14px 16px">
      <div style="display:flex;flex-direction:column;gap:8px">
        <p style="margin:0;font-size:12px;color:var(--muted)">Vigilia, a dashboard theme editor.</p>

        <dl style="margin:0">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:4px 0">
            <dt style="color:var(--text)">Schema version</dt>
            <dd style="margin:0;font-family:ui-monospace,Menlo,monospace;color:var(--text)">1</dd>
          </div>
        </dl>
      </div>

      <div style="margin-top:18px;display:flex;justify-content:flex-end">
        <span style="border:1px solid var(--edge);border-radius:6px;background:var(--panel2);padding:5px 12px;font-size:11.5px;color:var(--muted)">Close</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
