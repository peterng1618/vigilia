<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vigilia settings</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0e12; font: 12px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; }
</style>
</head>
<body>
<!-- The settings surface on its own. Copy is the product's own (ui-copy.ts
     `settings`, `shellPalettes`); the treatment is the original drawing's. -->
<div style="--bg:#0b0e12;--hdr:#12161c;--panel:#12161c;--panel2:#171c23;--well:#171c23;--well-edge:#242b34;
            --edge:#242b34;--edge2:#1b212a;--text:#e8ecf3;--muted:#8a97ab;--faint:#5a6675;--accent:#72e0c0;
            min-height:100vh;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px">

  <div style="width:560px;display:flex;border:1px solid var(--edge);border-radius:8px;background:var(--panel);box-shadow:0 24px 60px #000000b3;overflow:hidden">

    <div style="width:150px;flex:0 0 auto;background:#0e1217;border-right:1px solid var(--edge);padding:10px 6px">
      <div style="font:600 10px/1 system-ui;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);padding:4px 8px 8px">Settings</div>

      <div style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;background:#1d2733;box-shadow:inset 2px 0 0 var(--accent)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><circle cx="9" cy="10" r="1.3" fill="var(--accent)" stroke="none"/><circle cx="14" cy="14" r="1.3" fill="var(--accent)" stroke="none"/></svg>
        <span>Appearance</span>
      </div>

      <div style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;color:var(--muted)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h1M10 10h1M14 10h1M18 10h1M7 14h10"/></svg>
        <span>Keyboard</span>
      </div>

      <div style="display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;color:var(--muted)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M12 16v-5M12 8h.01"/></svg>
        <span>About</span>
      </div>
    </div>

    <div style="flex:1;min-width:0;padding:14px 16px">
      <div style="font:600 12px/1 system-ui;margin-bottom:10px">Shell palette</div>

      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        <div style="border:1px solid var(--edge);border-radius:8px;padding:8px;background:var(--panel2)">
          <div style="display:flex;gap:4px;margin-bottom:6px">
            <i style="flex:1;height:16px;border-radius:4px;background-color:#f5f1e8;border:1px solid var(--edge)"></i>
            <i style="flex:1;height:16px;border-radius:4px;background:#14120e"></i>
          </div>
          <div style="font-size:11px">editorial</div>
        </div>
        <div style="border:1px solid var(--accent);border-radius:8px;padding:8px;background:var(--panel2);box-shadow:0 0 0 3px #72e0c02e">
          <div style="display:flex;gap:4px;margin-bottom:6px">
            <i style="flex:1;height:16px;border-radius:4px;background-color:#0b0e12;border:1px solid var(--edge)"></i>
            <i style="flex:1;height:16px;border-radius:4px;background:#72e0c0"></i>
          </div>
          <div style="font-size:11px">graphite</div>
        </div>
        <div style="border:1px solid var(--edge);border-radius:8px;padding:8px;background:var(--panel2)">
          <div style="display:flex;gap:4px;margin-bottom:6px">
            <i style="flex:1;height:16px;border-radius:4px;background-color:#e9cdb4;border:1px solid var(--edge)"></i>
            <i style="flex:1;height:16px;border-radius:4px;background:#8f4208"></i>
          </div>
          <div style="font-size:11px">ember</div>
        </div>
        <div style="border:1px solid var(--edge);border-radius:8px;padding:8px;background:var(--panel2)">
          <div style="display:flex;gap:4px;margin-bottom:6px">
            <i style="flex:1;height:16px;border-radius:4px;background-color:#cfe0bb;border:1px solid var(--edge)"></i>
            <i style="flex:1;height:16px;border-radius:4px;background:#38601a"></i>
          </div>
          <div style="font-size:11px">moss</div>
        </div>
        <div style="border:1px solid var(--edge);border-radius:8px;padding:8px;background:var(--panel2)">
          <div style="display:flex;gap:4px;margin-bottom:6px">
            <i style="flex:1;height:16px;border-radius:4px;background-color:#dccdef;border:1px solid var(--edge)"></i>
            <i style="flex:1;height:16px;border-radius:4px;background:#543484"></i>
          </div>
          <div style="font-size:11px">plum</div>
        </div>
        <div style="border:1px solid var(--edge);border-radius:8px;padding:8px;background:var(--panel2)">
          <div style="display:flex;gap:4px;margin-bottom:6px">
            <i style="flex:1;height:16px;border-radius:4px;background:linear-gradient(145deg,#d8ebe4,#afd4d1);border:1px solid var(--edge)"></i>
            <i style="flex:1;height:16px;border-radius:4px;background:#1c6b4f"></i>
          </div>
          <div style="font-size:11px">light</div>
        </div>
      </div>

      <div style="margin-top:14px;display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel2);border:1px solid var(--edge);border-radius:8px">
        <span style="flex:1;font-size:11px">Follow the system</span>
        <span style="width:26px;height:14px;border-radius:999px;border:1px solid var(--edge);background:var(--panel2);position:relative;flex:0 0 auto">
          <span style="position:absolute;left:1.5px;top:1.5px;width:10px;height:10px;border-radius:50%;background:var(--muted)"></span>
        </span>
      </div>

      <div style="margin-top:16px;display:flex;justify-content:flex-end">
        <span style="border:1px solid var(--edge);border-radius:6px;background:var(--panel2);padding:4px 12px;font-size:12px;color:var(--muted)">Close</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
