name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (renderer, player)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vitest 5 requires ^22.12 || ^24 || >=26 — pin to an LTS the toolchain
          # actually supports rather than "latest", which can be an odd release.
          node-version: '24'
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm ci

      - name: Typecheck
        # Five projects, not four. The host joined them in ADR-0007; omitting it
        # here means CI finds a host type error only when someone runs the CLI.
        run: |
          npx tsc --noEmit -p packages/renderer-core/tsconfig.json
          npx tsc --noEmit -p packages/player/tsconfig.json
          npx tsc --noEmit -p packages/fake-source/tsconfig.json
          npx tsc --noEmit -p packages/editor/tsconfig.json
          npx tsc --noEmit -p packages/host/tsconfig.json

      - name: Unit tests
        run: npx vitest run

      - name: Build display-only player
        run: npx vite build packages/player

      - name: Build editor
        # Not optional and not only for the editor's own tests: Playwright starts
        # every `webServer` in its config regardless of which project runs, and
        # `vite preview` on an unbuilt package cannot start. `dist/` is
        # gitignored, so a fresh checkout has nothing until this step runs.
        run: npx vite build packages/editor

      - name: Build host
        # Not previewed by Playwright, so this is not the webServer trap — but
        # the bin shim refuses to start without dist/, so a build break here is
        # invisible until someone runs `vigilia`.
        run: npx vite build packages/host

      - name: Enforce display-only bundle budget (§47)
        # Fails if an editor dependency leaks into the player.
        run: node packages/player/scripts/check-size.mjs

      # Only Chromium: these tests assert structure and behaviour, not pixels,
      # so a second engine would triple the install time to re-check the same
      # DOM. Cross-browser and real-device coverage is Gate 0 work on named
      # reference hardware (§126).
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Display tests (browser)
        run: npx playwright test --project=desktop-chromium

      - name: Upload dashboard screenshots
        # Evidence for review, not a pass/fail baseline — glyph rasterisation
        # differs between this runner and a Windows development machine.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: src/web/test-results/screenshots/
          if-no-files-found: warn

  backend:
    name: Backend (.NET)
    # PAUSED until backend work starts. Nothing under src/Vigilia.* has ever
    # been compiled — there is no .NET SDK on the development machine, only the
    # EOL 6.0.35 runtime — so this job would fail on every push and drown the
    # frontend signal that is meaningful today.
    #
    # It is disabled rather than deleted so the steps stay reviewable and
    # re-enabling is a one-line change: delete the `if:` below. Expect
    # first-build errors when it runs for the first time; that is the point of
    # having it ready.
    if: false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Version comes from global.json (ADR-0002: .NET 10 LTS).
          global-json-file: global.json

      - run: dotnet restore Vigilia.slnx

      - name: Build
        # Warnings are errors via Directory.Build.props.
        run: dotnet build Vigilia.slnx --configuration Release --no-restore

      - name: Provider contract tests
        run: dotnet test Vigilia.slnx --configuration Release --no-build --verbosity normal

  licences:
    name: Licence notices present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every declared dependency must appear in THIRD-PARTY-NOTICES.md
        # §157 requires a complete licence inventory at Gate 0, and §132/§161
        # require notices to survive into packages. This is a coarse guard: it
        # catches a new dependency added without a notice entry.
        run: |
          set -euo pipefail
          missing=0
          for name in LibreHardwareMonitorLib echarts fabric; do
            if ! grep -qi "$name" THIRD-PARTY-NOTICES.md; then
              echo "::error::$name is not mentioned in THIRD-PARTY-NOTICES.md"
              missing=1
            fi
          done
          exit $missing
