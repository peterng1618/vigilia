<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Vigilia — devices</title>
    <style>
      /* Deliberately dependency-free: this page is served by the host itself,
         so it must not need a build step or a network fetch. */
      :root {
        --ink: #14120e;
        --paper: #f5f1e8;
        --line: #14120e;
        --muted: #5a5449;
        --accent: #8a5a2b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #e8ecf3;
          --paper: #14161c;
          --line: #2a3242;
          --muted: #8a97ab;
          --accent: #ffab00;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: var(--paper);
        color: var(--ink);
        font: 15px/1.5 system-ui, sans-serif;
      }
      main { max-width: 640px; margin: 0 auto; }
      h1 { font-size: 20px; letter-spacing: 0.02em; margin: 0 0 4px; }
      p.lead { color: var(--muted); margin: 0 0 24px; }
      fieldset {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        margin: 0 0 16px;
      }
      legend { padding: 0 6px; font-weight: 600; }
      label { display: block; margin: 12px 0 4px; font-size: 13px; }
      select, input[type="text"] {
        width: 100%;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
      }
      .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
      section { margin-bottom: 28px; }
      h2 { font-size: 15px; margin: 0 0 8px; letter-spacing: 0.02em; }
      .theme-list { display: grid; gap: 8px; }
      .theme-option {
        display: flex;
        align-items: baseline;
        gap: 8px;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .theme-option[aria-pressed="true"] {
        border-width: 2px;
        border-color: var(--ink);
        font-weight: 600;
        background: color-mix(in srgb, var(--ink) 8%, transparent);
      }
      /* The chosen theme is stated in words too, so the state does not rest on
         a visual difference alone. */
      .theme-option .current {
        margin-left: auto;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .theme-option .by { color: var(--muted); font-size: 13px; }
      #status {
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: 6px;
        border: 1px solid var(--line);
        color: var(--muted);
        font-family: ui-monospace, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>This PC</h1>
      <p class="lead">
        Choose the theme your displays show, and which hardware it reports.
      </p>
      <section aria-labelledby="themes-heading">
        <h2 id="themes-heading">Themes</h2>
        <p class="hint" id="themes-hint"></p>
        <div id="themes"></div>
      </section>
      <section aria-labelledby="devices-heading">
        <h2 id="devices-heading">Devices</h2>
        <p class="hint">
          A theme shows one GPU and one disk; these settings decide which.
        </p>
        <div id="groups"></div>
      </section>
      <div id="status">Loading…</div>
    </main>
    <script type="module">
      const status = document.querySelector("#status");
      const groups = document.querySelector("#groups");
      const themesHost = document.querySelector("#themes");
      const themesHint = document.querySelector("#themes-hint");

      const GROUP_LABELS = {
        gpu: "Graphics card",
        "system-disk": "System disk",
        "data-disk": "Data disk",
      };

      let state = { available: { gpus: [], disks: [] }, assigned: {}, names: {} };
      let themes = [];
      let activeTheme = null;

      function renderThemes() {
        themesHost.replaceChildren();
        themesHint.textContent =
          themes.length === 0
            ? "No themes are saved on this PC yet. Build one in the editor, then save it here."
            : themes.length === 1
              ? "The only saved theme is shown on every display."
              : "Pick the theme your displays should show.";

        if (themes.length === 0) return;

        const list = document.createElement("div");
        list.className = "theme-list";
        for (const theme of themes) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "theme-option";
          button.dataset.theme = theme.id;
          const isActive = theme.id === activeTheme;
          button.setAttribute("aria-pressed", String(isActive));
          // Two themes can share a display name; the id tells them apart.
          const duplicated =
            themes.filter((other) => (other.name ?? other.id) === (theme.name ?? theme.id))
              .length > 1;
          button.append(
            duplicated
              ? `${theme.name ?? theme.id} (${theme.id})`
              : (theme.name ?? theme.id),
          );
          if (theme.author !== undefined) {
            const by = document.createElement("span");
            by.className = "by";
            by.textContent = theme.author;
            button.append(by);
          }
          if (isActive) {
            const current = document.createElement("span");
            current.className = "current";
            current.textContent = "Showing";
            button.append(current);
          }
          button.addEventListener("click", () => chooseTheme(theme.id));
          list.append(button);
        }
        themesHost.append(list);
      }

      async function chooseTheme(id) {
        status.textContent = "Saving…";
        try {
          const response = await fetch("/api/themes/active", {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ id }),
          });
          if (!response.ok) throw new Error(await response.text());
          activeTheme = id;
          renderThemes();
          status.textContent = "Saved. Displays show it on their next load.";
        } catch (error) {
          status.textContent = `Could not save: ${error.message}`;
        }
      }

      async function loadThemes() {
        const response = await fetch("/api/themes/active");
        if (!response.ok) return;
        const body = await response.json();
        themes = body.themes ?? [];
        activeTheme = body.active ?? null;
        renderThemes();
      }
      let saving = false;

      function optionsFor(group) {
        return group === "gpu" ? state.available.gpus : state.available.disks;
      }

      function render() {
        groups.replaceChildren();
        let rendered = 0;

        for (const [group, label] of Object.entries(GROUP_LABELS)) {
          const devices = optionsFor(group);
          if (devices.length === 0) continue;
          rendered += 1;

          const fieldset = document.createElement("fieldset");
          const legend = document.createElement("legend");
          legend.textContent = label;
          fieldset.append(legend);

          const selectLabel = document.createElement("label");
          selectLabel.textContent = devices.length === 1
            ? "Only one found"
            : "Which device should dashboards use?";
          const select = document.createElement("select");
          select.dataset.group = group;

          // A default option exists whatever the count, so the control always
          // shows something and a consumer can undo a choice.
          const all = document.createElement("option");
          all.value = "";
          all.textContent = group === "gpu"
            ? "Busiest (default)"
            : "All disks combined (default)";
          select.append(all);

          for (const device of devices) {
            const option = document.createElement("option");
            option.value = device.id;
            option.textContent = state.names[device.id] ?? device.name;
            select.append(option);
          }

          select.value = state.assigned[group] ?? "";
          select.addEventListener("change", () => save({ assigned: { [group]: select.value } }));
          // The name belongs to one device, so this field edits the device the
          // select currently points at: the chosen one, else the first.
          const targetFor = () => state.assigned[group] || devices[0]?.id || "";
          const nameLabel = document.createElement("label");
          nameLabel.textContent = "Name shown in this list";
          const name = document.createElement("input");
          name.type = "text";
          name.dataset.name = group;
          const targetDevice = devices.find((d) => d.id === targetFor());
          name.placeholder = targetDevice?.name ?? "";
          name.value = targetDevice ? (state.names[targetDevice.id] ?? "") : "";
          name.addEventListener("change", () => {
            const target = targetFor();
            if (target) save({ names: { [target]: name.value } });
          });

          fieldset.append(selectLabel, select, nameLabel, name);
          groups.append(fieldset);
        }

        if (rendered === 0) {
          const empty = document.createElement("p");
          empty.className = "hint";
          empty.textContent =
            "No graphics card or disk was reported. Start LibreHardwareMonitor " +
            "with its web server enabled, then reload this page.";
          groups.append(empty);
        }
      }

      async function save(patch) {
        if (saving) return;
        saving = true;
        status.textContent = "Saving…";
        try {
          const response = await fetch("/api/devices", {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              assigned: { ...state.assigned, ...(patch.assigned ?? {}) },
              names: { ...state.names, ...(patch.names ?? {}) },
            }),
          });
          if (!response.ok) throw new Error(await response.text());
          const saved = await response.json();
          state.assigned = saved.assigned.assigned;
          state.names = saved.assigned.names;
          status.textContent = "Saved. Displays update on their next frame.";
          render();
        } catch (error) {
          status.textContent = `Could not save: ${error.message}`;
        } finally {
          saving = false;
        }
      }

      async function load() {
        try {
          const response = await fetch("/api/devices");
          if (!response.ok) throw new Error(await response.text());
          const body = await response.json();
          state = {
            available: body.available,
            assigned: body.assigned.assigned ?? {},
            names: body.assigned.names ?? {},
          };
          status.textContent = "Changes apply to every display immediately.";
          render();
        } catch (error) {
          status.textContent = `Could not read devices: ${error.message}`;
        }
      }

      await loadThemes();
      await load();
    </script>
  </body>
</html>
