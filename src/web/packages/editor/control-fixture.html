<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Vigilia — control fixture</title>
    <!-- The design-language parity fixture. It exists so
         `tests/e2e/design-language.spec.ts` can mount the *built* control set
         over the *built* stylesheet and assert the language in a real browser —
         hit areas, contrast, forced colours and layout at 200% zoom, none of
         which jsdom can carry. It is a build entry of its own (see
         `vite.config.ts`) rather than a branch inside `editor-main.ts`, so the
         shipped editor carries no test-only path. Its route is
         `/control-fixture.html` on the editor preview. -->
    <style>
      /* The page shape `index.html` gives the real editor, and for the same
         reason: `.editor-shell` sets `min-height: 100%`, and an unlayered rule
         beats a Tailwind `min-h-screen` whatever its specificity, so the shell
         needs a parent with a height. Without it the capture shows the fixture
         floating on a blank page rather than filling a surface. */
      html,
      body,
      #control-fixture {
        margin: 0;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="control-fixture"></div>
    <script type="module" src="/src/control-fixture.tsx"></script>
  </body>
</html>
